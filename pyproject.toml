[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vcv-rack-mcp"
version = "0.1.0"
description = "MCP server for VCV Rack 2 — generative patch authorship from natural language"
authors = [{name = "Sandra Schipal", email = "sandra@sandraschi.dev"}]
maintainers = [{name = "Sandra Schipal", email = "sandra@sandraschi.dev"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastmcp>=3.4.2,<4",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "prefab-ui>=0.14.0",
    "rich>=13.0.0",
    "aiosqlite>=0.20.0",
    "starlette>=0.40.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[project.scripts]
vcv-rack-mcp = "vcv_rack_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vcv_rack_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
